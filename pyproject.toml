[project]
name = "EasyPPTX"
version = "0.8.0"
description = "A Python library for easily creating and manipulating PowerPoint presentations programmatically with simple APIs."
authors = [{ name = "Ameyanagi", email = "contact@ameyanagi.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pillow>=10.0.0",
    "python-pptx>=1.0.2",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.2.3"]
plot = ["matplotlib>=3.9.4"]
all = ["pandas>=2.2.3", "matplotlib>=3.9.4"]

[project.urls]
Homepage = "https://Ameyanagi.github.io/EasyPPTX/"
Repository = "https://github.com/Ameyanagi/EasyPPTX"
Documentation = "https://Ameyanagi.github.io/EasyPPTX/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "deptry>=0.23.0",
    "ruff>=0.11.5",
    "ty>=0.0.1a5",
    "lefthook>=1.10.0",
    "pandas>=2.2.3",
    "matplotlib>=3.9.4",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "polars>=1.43.2",
    "numpy>=2.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easypptx"]

# Type-check the library; tests rely heavily on MagicMock and are exercised by pytest
[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-print
    "T20",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/*" = ["TRY003", "C901", "TRY300"]
"examples/*" = ["S311", "T20"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.deptry]
ignore = ["DEP003"]

[tool.deptry.per_rule_ignores]
# pandas/matplotlib are optional extras: imported lazily (or duck-typed via
# sys.modules), so deptry sees them as unused/undeclared.
DEP001 = ["pandas", "matplotlib"]
DEP002 = ["pandas", "matplotlib"]
DEP004 = ["pandas", "matplotlib"]
